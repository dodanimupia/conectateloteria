name: Actualizar resultados de lotería

# Se ejecuta sola cada 5 minutos, y también se puede lanzar a mano
# desde la pestaña "Actions" del repositorio en GitHub (botón "Run workflow").
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

# Necesario para que la Action pueda hacer commit y push del JSON actualizado
permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install playwright beautifulsoup4
          playwright install --with-deps chromium

      - name: Ejecutar el scraper
        run: python actualizar_datos.py

      # Escribe los números YA DENTRO del HTML (portada + una página por
      # lotería) y deja todo listo en la carpeta "publicar".
      #
      # Esto es importante para Google: si las bolas se dibujaran solo con
      # JavaScript, el buscador recibiría el HTML vacío y tendría que volver
      # más tarde a ejecutar el script. Para una página de "resultados de hoy"
      # esa demora hace que nunca posicione. Con los números ya escritos, el
      # buscador los ve en la primera visita.
      #
      # Este paso también actualiza historial.json, que va acumulando los
      # sorteos de los últimos días.
      - name: Construir las páginas con los números dentro
        run: python construir_paginas.py

      # Guarda en el repositorio tanto los datos del día como el historial.
      # El historial DEBE quedar commiteado: es la única forma de que los
      # días anteriores sigan ahí en la siguiente ejecución, porque cada
      # ejecución arranca en una máquina limpia.
      - name: Guardar datos e historial si cambiaron
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add datos_loteria.json historial.json
          git diff --cached --quiet || git commit -m "Actualizar resultados e historial [skip ci]"
          git pull --rebase --autostash
          git push

      # Sube a SiteGround por FTPS (FTP cifrado con TLS) el JSON y las páginas
      # ya construidas. Requiere 2 secrets en el repo
      # (Settings -> Secrets and variables -> Actions):
      # FTP_USERNAME y FTP_PASSWORD. Se crean en SiteGround:
      # Site Tools -> Sitio web -> Cuentas FTP -> "Crear cuenta nueva FTP".
      #
      # Solo se suben los archivos de "publicar", así que las páginas que no
      # cambian (legales, guías, estilos, logos) quedan intactas en el servidor.
      - name: Subir resultados y páginas a SiteGround por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ftp.conectateloteria.com
          port: 21
          protocol: ftps
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: "./publicar/"
          server-dir: "/conectateloteria.com/public_html/"
          dangerous-clean-slate: false
          # Ahora se suben ~22 archivos (antes 11). Con el tiempo de espera
          # por defecto (30s) la conexión se cortaba a mitad de la subida
          # con "Timeout (control socket)", así que le damos margen.
          timeout: 180000
